name: openapi_flutter_gen
description: >-
  Zero build_runner OpenAPI-to-Dart code generator.
  Produces immutable models, sealed exhaustive responses,
  typed auth interceptors, pagination, and Isolate-based deserialization.
version: 0.2.4
repository: https://github.com/PurpleSoftSrl/openapi_flutter_gen
issue_tracker: https://github.com/PurpleSoftSrl/openapi_flutter_gen/issues
topics:
  - openapi
  - swagger
  - codegen
  - api
  - flutter

environment:
  sdk: ^3.4.0

dependencies:
  yaml: ^3.1.0
  args: ^2.5.0
  path: ^1.9.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

executables:
  openapi_flutter_gen: main

